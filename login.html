<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="stylec.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-form">
            <div class="close-button">X</div>
            <div class="logo">Nenbites</div>
            <h2>Inicia Sesión en tu Cuenta</h2>
            <p class="social-login-text">Inicia Sesión con redes sociales</p>
            <div class="social-login">
                <button class="social-button facebook-button"><img src="https://png.pngtree.com/png-clipart/20230401/original/pngtree-facebook-icon-social-media-png-image_9015415.png" alt="Facebook"></button>
                <button class="social-button google-button"><img src="https://cdn-icons-png.flaticon.com/512/220/220218.png" alt="Google"></button>
                <button class="social-button linkedin-button">in</button>
            </div>
            <p class="or">OR</p>
            <div class="form-fields">
                <input type="email" placeholder="Correo electrónico" id="email" required>
                <div class="password-container">
                    <input type="password" placeholder="Contraseña" required id="password">
                    <span class="eye-icon eye-icon-login">&#128065;</span>
                </div>
                <button class="sign-up-button-register">Regístrate</button>
            </div>
        </div>
        <div class="new-here-section">
            <h2>¿Eres Nuevo Aquí?</h2>
            <p>¡Regístrate y descubre una gran cantidad de nuevas oportunidades!</p>
            <button class="sign-up-button">Regístrate</button>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
